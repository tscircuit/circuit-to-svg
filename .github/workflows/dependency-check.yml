name: Dependency Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  format-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run Dependency Check
        run: bunx @tscircuit/dependency-check
        env:
          # You should usually use internal_lib
          # Other options:
          #  - bundled_lib: No peer dependencies, no dependencies
          INPUT_PACKAGE_TYPE: internal_lib

          # dependency-check 0.0.7 always enforces "*" unless these packages are ignored.
          INPUT_IGNORE_PACKAGES: "@tscircuit/alphabet,@tscircuit/circuit-json-util,circuit-json,circuit-json-to-connectivity-map,schematic-symbols"
          # INPUT_ADDITIONAL_INTERNAL_PACKAGES: "circuit-json,..."
